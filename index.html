<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#15803d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%2315803d'/%3E%3Ccircle cx='4' cy='4' r='2' fill='%23fff'/%3E%3C/svg%3E">
<title>Caddy – Golf GPS &amp; Club Advisor</title>
<style>
@import url("https://unpkg.com/leaflet@1.9.4/dist/leaflet.css");
:root{--ink:#0f1f16;--mut:#34443a;--line:#e4ebe6;--soft:#f2f6f3;--acc:#16a34a;--accd:#0f7a37;--warn:#b45309;--bad:#c62828;--blue:#2563eb;--sh:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d2a1a;color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
#map{position:fixed;inset:0;background:#0d2a1a}
.leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.7)!important}
.leaflet-container{font:inherit}

/* top bar */
#top{position:fixed;z-index:1000;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
.pill{background:#fff;border-radius:999px;padding:0 14px;min-height:48px;font-size:14px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.28);display:flex;align-items:center;gap:7px;border:0}
.dot{width:9px;height:9px;border-radius:50%;background:#aaa;display:inline-block}
.dot.ok{background:var(--acc)}.dot.wait{background:#f59e0b}.dot.bad{background:var(--bad)}
.fab{width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.28);font-size:20px;display:grid;place-items:center}
#locate{position:fixed;z-index:1000;right:10px;bottom:calc(var(--sh) + 12px)}

/* bottom sheet */
#sheet{position:fixed;z-index:1100;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.3);padding:8px 16px calc(env(safe-area-inset-bottom) + 14px);max-height:62dvh;overflow-y:auto}
@media (max-height:700px){#sheet{max-height:54dvh}}
#grab{width:42px;height:5px;border-radius:3px;background:#d3dbd6;margin:0 auto 10px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.club{font-size:38px;font-weight:800;letter-spacing:-.8px;line-height:1.05}
.dist{font-size:38px;font-weight:800;letter-spacing:-.8px;line-height:1;text-align:right}
.dist small{font-size:16px;font-weight:700;color:var(--mut);margin-left:3px}
.plays{font-size:15px;color:var(--mut);text-align:right;font-weight:600}
.aim{margin-top:8px;background:#fff7e6;color:var(--warn);border-radius:12px;padding:9px 12px;font-weight:700;font-size:15px}
.why{color:var(--mut);font-size:15px;margin:8px 0 2px}
.chiprow{display:flex;gap:10px;margin:10px 0 12px;overflow-x:auto;padding-bottom:2px}
.cond{flex:none;background:var(--soft);border:0;border-radius:999px;padding:0 16px;min-height:48px;font-weight:700;font-size:15px}
.cta{width:100%;border:0;background:#15803d;color:#fff;font-weight:800;font-size:18px;padding:16px;border-radius:16px}
.cta:active{background:var(--accd)}
.link{background:none;border:0;color:var(--mut);font-weight:700;font-size:15px;padding:0 10px;min-height:48px}
.center{text-align:center}
.big-msg{font-size:24px;font-weight:800;margin:6px 0 4px}
.sub{color:var(--mut);font-size:15px}
.sec{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:0 16px;min-height:48px;font-weight:700;font-size:15px}
.sec.on,.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.det h4{margin:14px 0 8px;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:0 16px;min-width:48px;min-height:48px;font-weight:700;font-size:15px}
.alt{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.alt b{font-weight:700}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:22px;font-weight:700}
.stepper .v{font-size:26px;font-weight:800;min-width:92px;text-align:center}
.stepper .v small{font-size:14px;color:var(--mut);font-weight:700}

/* overlays */
.overlay{position:fixed;inset:0;z-index:2000;background:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.overlay[hidden],#modal[hidden]{display:none}
.ohead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.ohead h2{margin:0;font-size:22px}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);font-size:18px}
.obody{flex:1;overflow-y:auto;padding:4px 16px calc(env(safe-area-inset-bottom) + 20px)}
.tabs{display:flex;gap:6px;padding:4px 16px 10px}
.tabs button{flex:1;border:0;background:var(--soft);border-radius:12px;padding:0 2px;min-height:48px;font-weight:700;font-size:13px;color:var(--mut)}
.tabs button.on{background:var(--ink);color:#fff}
#modal{position:fixed;inset:0;z-index:2100;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
#modal .card{background:#fff;width:100%;border-radius:22px 22px 0 0;max-height:92dvh;overflow-y:auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 18px)}
.field{margin:14px 0}
.card h3{margin:0}
input[type=text],input[type=number]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px;font-size:16px;background:#fff;color:var(--ink);min-width:0}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc)}
.brow{display:grid;grid-template-columns:minmax(80px,1.5fr) 1fr 1fr 28px 44px;gap:7px;align-items:center;margin-bottom:8px}
.brow.h{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase}
.hint{background:var(--soft);border-radius:14px;padding:12px;font-size:14px;color:var(--mut);margin:10px 0}
.shot{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.dial{display:block;margin:6px auto;touch-action:none}
.legend{font-size:13px;color:var(--mut);text-align:center}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin:0 4px 2px 0}

.clubbtn{min-height:48px;border:0;background:none;padding:0;font-size:38px;font-weight:800;letter-spacing:-.8px;line-height:1.05;text-align:left}
.clubbtn span{font-size:20px;color:var(--mut)}
.pick{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;text-align:left;font-size:16px}
.pick.on{border-color:var(--acc);background:#effaf2}
.pick small{color:var(--mut);font-weight:600}
.pick em{font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--acc);border-radius:999px;padding:2px 7px;margin-left:4px;vertical-align:middle}
.sc{display:grid;grid-template-columns:34px 40px 1fr 1fr 40px 40px;text-align:center;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);font-size:15px}
.sc.hd{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--mut)}
.sc.cur{background:#effaf2}
.sc.tot{font-weight:800;background:var(--soft)}
.sc[data-act]{cursor:pointer}
.scv{display:inline-grid;place-items:center;min-width:30px;height:30px;font-weight:800;border-radius:50%}
.scv.bir{border:2px solid var(--acc)}.scv.eag{background:var(--acc);color:#fff}.scv.bog{border:2px solid #999;border-radius:6px}.scv.dbl{background:#999;color:#fff;border-radius:6px}
.cond.pickon{background:var(--ink);color:#fff}
.sc.lite{grid-template-columns:44px 60px 1fr}
.stepper button.scorebtn{width:auto;min-width:96px;border:0;background:none;font-size:42px;font-weight:800;border-radius:12px}
.stepper button.scorebtn.ghost{color:#6b7a71}
.x{width:48px!important;height:48px!important}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:14px;padding:10px}
#holePill{border:0}
/* map markers */
.me{width:20px;height:20px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 4px rgba(37,99,235,.3)}
.tg{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid #fff;box-shadow:0 1px 8px rgba(0,0,0,.6);display:grid;place-items:center}
.tg::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--acc);border:2px solid #fff}
.pn{font-size:30px;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,.8))}
.tag{white-space:nowrap;background:#fff;color:var(--ink);border-radius:999px;font-weight:800;font-size:13px;padding:3px 9px;box-shadow:0 1px 6px rgba(0,0,0,.45);transform:translate(-50%,-50%);display:inline-block}
.tag.y{background:#ffe08a}
.tag.up{transform:translate(-50%,-190%)}
.hzm{width:22px;height:22px;border-radius:50%;background:#ef4444;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.6)}
.hz{margin-top:8px;background:#fdecea;color:#8a1c1c;border-radius:12px;padding:9px 12px;font-weight:700;font-size:15px}
.hz div{margin-top:3px}
.hz div:first-child{margin-top:0}
.hzh{display:flex;justify-content:space-between;align-items:center}
.hzx{border:0;background:none;font-size:16px;font-weight:800;min-width:48px;min-height:48px;margin:-14px -8px -14px 0;color:#8a1c1c}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hcard{border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px;text-align:left;position:relative}
.hcard.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc);background:#f3fbf5}
.hth{width:100%;height:110px;border-radius:10px;display:block}
.hn{font-weight:800;font-size:15px;margin-top:6px;line-height:1.15}
.hs{font-size:12px;color:var(--mut);line-height:1.2;min-height:15px}
.hm{font-size:13px;color:var(--ink);font-weight:700;margin-top:3px;display:flex;justify-content:space-between;align-items:center}
.lv{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px}
.lv.m{background:#fef3c7;color:#92400e}.lv.e{background:#dcfce7;color:#166534}.lv.t{background:#fee2e2;color:#991b1b}
.tick{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.vhtitle{font-size:21px;font-weight:800;line-height:1.15;letter-spacing:-.3px}
.ly{width:30px;height:30px;border-radius:50%;background:rgba(255,193,7,.35);border:3px solid #ffc107;box-shadow:0 1px 8px rgba(0,0,0,.6);display:grid;place-items:center}
.ly::after{content:"";width:10px;height:10px;border-radius:50%;background:#ffc107;border:2px solid #fff}
</style>
</head>
<body>
<div id="map"></div>
<div id="top">
  <button class="pill" id="gps"><i class="dot wait"></i><span>Finding GPS…</span></button>
  <button class="pill" id="holePill" hidden></button>
  <button class="fab" id="menuBtn" aria-label="Menu">☰</button>
</div>
<button class="fab" id="locate" aria-label="Centre on me">◎</button>
<div id="sheet"><div id="grab"></div><div id="sheetBody"></div></div>

<div class="overlay" id="panel" hidden>
  <div class="ohead"><h2 id="ptitle">Menu</h2><button class="x" id="pclose">✕</button></div>
  <div class="tabs" id="ptabs">
    <button data-p="round" class="on">Round</button><button data-p="range">Range</button><button data-p="swing">Swing</button><button data-p="bag">Bag</button><button data-p="settings">Settings</button>
  </div>
  <div class="obody" id="pbody"></div>
</div>
<div id="modal" hidden><div class="card" id="mcard"></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>if(typeof L==="undefined"){document.body.insertAdjacentHTML("beforeend","<div style=\"position:fixed;inset:0;z-index:9999;background:#fff;padding:30px;font:16px sans-serif\">The map could not load. Check your connection and reload.<br><br>Não foi possível carregar o mapa. Verifica a ligação e recarrega.</div>");}</script>
<script src="pt.js?v=11"></script>
<script src="core.js?v=11"></script>
<script src="sheet.js?v=11"></script>
<script src="panel.js?v=11"></script>
<script src="holes.js?v=11"></script>
<script src="app.js?v=11"></script>
<script src="swing.js?v=15"></script>
<script src="drills.js?v=1"></script>

<script>if("serviceWorker" in navigator&&/^https:|^http:\/\/localhost/.test(location.protocol+"//"+location.hostname))navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body>
</html>
