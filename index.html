<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#15803d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<title>Caddy – Golf GPS &amp; Club Advisor</title>
<style>
@import url("https://unpkg.com/leaflet@1.9.4/dist/leaflet.css");
:root{--ink:#0f1f16;--mut:#34443a;--line:#e4ebe6;--soft:#f2f6f3;--acc:#16a34a;--accd:#0f7a37;--warn:#b45309;--bad:#c62828;--blue:#2563eb;--sh:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d2a1a;color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
#map{position:fixed;inset:0;background:#0d2a1a}
.leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.7)!important}
.leaflet-container{font:inherit}

/* top bar */
#top{position:fixed;z-index:1000;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
.pill{background:#fff;border-radius:999px;padding:0 14px;min-height:48px;font-size:14px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.28);display:flex;align-items:center;gap:7px;border:0}
.dot{width:9px;height:9px;border-radius:50%;background:#aaa;display:inline-block}
.dot.ok{background:var(--acc)}.dot.wait{background:#f59e0b}.dot.bad{background:var(--bad)}
.fab{width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.28);font-size:20px;display:grid;place-items:center}
#locate{position:fixed;z-index:1000;right:10px;bottom:calc(var(--sh) + 12px)}

/* bottom sheet */
#sheet{position:fixed;z-index:1100;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.3);padding:8px 16px calc(env(safe-area-inset-bottom) + 14px);max-height:62dvh;overflow-y:auto}
@media (max-height:700px){#sheet{max-height:54dvh}}
#grab{width:42px;height:5px;border-radius:3px;background:#d3dbd6;margin:0 auto 10px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.club{font-size:38px;font-weight:800;letter-spacing:-.8px;line-height:1.05}
.dist{font-size:38px;font-weight:800;letter-spacing:-.8px;line-height:1;text-align:right}
.dist small{font-size:16px;font-weight:700;color:var(--mut);margin-left:3px}
.plays{font-size:15px;color:var(--mut);text-align:right;font-weight:600}
.aim{margin-top:8px;background:#fff7e6;color:var(--warn);border-radius:12px;padding:9px 12px;font-weight:700;font-size:15px}
.why{color:var(--mut);font-size:15px;margin:8px 0 2px}
.chiprow{display:flex;gap:10px;margin:10px 0 12px;overflow-x:auto;padding-bottom:2px}
.cond{flex:none;background:var(--soft);border:0;border-radius:999px;padding:0 16px;min-height:48px;font-weight:700;font-size:15px}
.cta{width:100%;border:0;background:#15803d;color:#fff;font-weight:800;font-size:18px;padding:16px;border-radius:16px}
.cta:active{background:var(--accd)}
.link{background:none;border:0;color:var(--mut);font-weight:700;font-size:15px;padding:0 10px;min-height:48px}
.center{text-align:center}
.big-msg{font-size:24px;font-weight:800;margin:6px 0 4px}
.sub{color:var(--mut);font-size:15px}
.sec{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:0 16px;min-height:48px;font-weight:700;font-size:15px}
.sec.on,.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.det h4{margin:14px 0 8px;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:0 16px;min-width:48px;min-height:48px;font-weight:700;font-size:15px}
.alt{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.alt b{font-weight:700}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:22px;font-weight:700}
.stepper .v{font-size:26px;font-weight:800;min-width:92px;text-align:center}
.stepper .v small{font-size:14px;color:var(--mut);font-weight:700}

/* overlays */
.overlay{position:fixed;inset:0;z-index:2000;background:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.overlay[hidden],#modal[hidden]{display:none}
.ohead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.ohead h2{margin:0;font-size:22px}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);font-size:18px}
.obody{flex:1;overflow-y:auto;padding:4px 16px calc(env(safe-area-inset-bottom) + 20px)}
.tabs{display:flex;gap:6px;padding:4px 16px 10px}
.tabs button{flex:1;border:0;background:var(--soft);border-radius:12px;padding:0 4px;min-height:48px;font-weight:700;font-size:15px;color:var(--mut)}
.tabs button.on{background:var(--ink);color:#fff}
#modal{position:fixed;inset:0;z-index:2100;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
#modal .card{background:#fff;width:100%;border-radius:22px 22px 0 0;max-height:92dvh;overflow-y:auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 18px)}
.field{margin:14px 0}
.card h3{margin:0}
input[type=text],input[type=number]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px;font-size:16px;background:#fff;color:var(--ink);min-width:0}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc)}
.brow{display:grid;grid-template-columns:minmax(80px,1.5fr) 1fr 1fr 28px 44px;gap:7px;align-items:center;margin-bottom:8px}
.brow.h{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase}
.hint{background:var(--soft);border-radius:14px;padding:12px;font-size:14px;color:var(--mut);margin:10px 0}
.shot{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.dial{display:block;margin:6px auto;touch-action:none}
.legend{font-size:13px;color:var(--mut);text-align:center}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin:0 4px 2px 0}

.clubbtn{min-height:48px;border:0;background:none;padding:0;font-size:38px;font-weight:800;letter-spacing:-.8px;line-height:1.05;text-align:left}
.clubbtn span{font-size:20px;color:var(--mut)}
.pick{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;text-align:left;font-size:16px}
.pick.on{border-color:var(--acc);background:#effaf2}
.pick small{color:var(--mut);font-weight:600}
.pick em{font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--acc);border-radius:999px;padding:2px 7px;margin-left:4px;vertical-align:middle}
.sc{display:grid;grid-template-columns:34px 40px 1fr 1fr 40px 40px;text-align:center;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);font-size:15px}
.sc.hd{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--mut)}
.sc.cur{background:#effaf2}
.sc.tot{font-weight:800;background:var(--soft)}
.sc[data-act]{cursor:pointer}
.scv{display:inline-grid;place-items:center;min-width:30px;height:30px;font-weight:800;border-radius:50%}
.scv.bir{border:2px solid var(--acc)}.scv.eag{background:var(--acc);color:#fff}.scv.bog{border:2px solid #999;border-radius:6px}.scv.dbl{background:#999;color:#fff;border-radius:6px}
.cond.pickon{background:var(--ink);color:#fff}
.sc.lite{grid-template-columns:44px 60px 1fr}
.stepper button.scorebtn{width:auto;min-width:96px;border:0;background:none;font-size:42px;font-weight:800;border-radius:12px}
.stepper button.scorebtn.ghost{color:#6b7a71}
.x{width:48px!important;height:48px!important}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:14px;padding:10px}
#holePill{border:0}
/* map markers */
.me{width:20px;height:20px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 4px rgba(37,99,235,.3)}
.tg{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid #fff;box-shadow:0 1px 8px rgba(0,0,0,.6);display:grid;place-items:center}
.tg::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--acc);border:2px solid #fff}
.pn{font-size:30px;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,.8))}
.tag{white-space:nowrap;background:#fff;color:var(--ink);border-radius:999px;font-weight:800;font-size:13px;padding:3px 9px;box-shadow:0 1px 6px rgba(0,0,0,.45);transform:translate(-50%,-50%);display:inline-block}
.tag.y{background:#ffe08a}
.tag.up{transform:translate(-50%,-190%)}
.hzm{width:22px;height:22px;border-radius:50%;background:#ef4444;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.6)}
.hz{margin-top:8px;background:#fdecea;color:#8a1c1c;border-radius:12px;padding:9px 12px;font-weight:700;font-size:15px}
.hz div{margin-top:3px}
.hz div:first-child{margin-top:0}
.hzh{display:flex;justify-content:space-between;align-items:center}
.hzx{border:0;background:none;font-size:16px;font-weight:800;min-width:48px;min-height:48px;margin:-14px -8px -14px 0;color:#8a1c1c}
.ly{width:30px;height:30px;border-radius:50%;background:rgba(255,193,7,.35);border:3px solid #ffc107;box-shadow:0 1px 8px rgba(0,0,0,.6);display:grid;place-items:center}
.ly::after{content:"";width:10px;height:10px;border-radius:50%;background:#ffc107;border:2px solid #fff}
</style>
</head>
<body>
<div id="map"></div>
<div id="top">
  <button class="pill" id="gps"><i class="dot wait"></i><span>Finding GPS…</span></button>
  <button class="pill" id="holePill" hidden></button>
  <button class="fab" id="menuBtn" aria-label="Menu">☰</button>
</div>
<button class="fab" id="locate" aria-label="Centre on me">◎</button>
<div id="sheet"><div id="grab"></div><div id="sheetBody"></div></div>

<div class="overlay" id="panel" hidden>
  <div class="ohead"><h2 id="ptitle">Menu</h2><button class="x" id="pclose">✕</button></div>
  <div class="tabs" id="ptabs">
    <button data-p="round" class="on">Round</button><button data-p="range">Range</button><button data-p="bag">Bag</button><button data-p="settings">Settings</button>
  </div>
  <div class="obody" id="pbody"></div>
</div>
<div id="modal" hidden><div class="card" id="mcard"></div></div>

/* ================= geometry ================= */
const rad=Math.PI/180;
function dist(a,b){const dLa=(b.lat-a.lat)*rad,dLn=(b.lng-a.lng)*rad;const x=Math.sin(dLa/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLn/2)**2;return 2*6371000*Math.asin(Math.sqrt(x));}
function bearing(a,b){const y=Math.sin((b.lng-a.lng)*rad)*Math.cos(b.lat*rad);const x=Math.cos(a.lat*rad)*Math.sin(b.lat*rad)-Math.sin(a.lat*rad)*Math.cos(b.lat*rad)*Math.cos((b.lng-a.lng)*rad);return (Math.atan2(y,x)/rad+360)%360;}
const DIRS=[['N',0],['NE',45],['E',90],['SE',135],['S',180],['SW',225],['W',270],['NW',315]];
function angd(a,b){return Math.abs(((a-b+540)%360)-180);}
function nearestDir(deg){return DIRS.reduce((a,b)=>angd(deg,a[1])<=angd(deg,b[1])?a:b)[0];}

/* ================= caddy brain ================= */
const LIES=[{n:'Fairway / tee',add:0,roll:1},{n:'Light rough',add:.05,roll:.7},{n:'Heavy rough',add:.12,roll:.5},{n:'Bunker',add:.12,roll:.4}];
const MODES={auto:{n:'Auto'},carry:{n:'Carry a hazard',w:0},approach:{n:'Approach',w:.35},total:{n:'Tee shot / lay-up',w:1}};
function calc(D,brg){
  const c=S.cond,mph=c.windKmh/KMH_MPH;
  let head=0,cross=0;
  if(brg!=null){const th=(c.windFrom-brg)*rad;head=mph*Math.cos(th);cross=mph*Math.sin(th);}
  const windPct=head>=0?head*0.01:head*0.005;
  const tempPct=(20-c.temp)*0.002;
  const rainPct=[0,0.01,0.02][c.rain];
  const lie=LIES[c.lie];
  const altPct=-(S.alt||0)/300*0.01,stPct=c.stance===1?0.04:(c.stance===-1?-0.03:0);
  const pct=windPct+tempPct+rainPct+lie.add+altPct+stPct;
  const plays=D*(1+pct)+c.elev;
  const rollMult=[0.7,1,1.25][c.ground]*[1,0.75,0.55][c.rain]*lie.roll;
  const drift=Math.abs(cross)*D*0.004;
  return{D,plays,pct,rollMult,head,cross,drift,parts:{wind:D*windPct,temp:D*tempPct,rain:D*rainPct,lie:D*lie.add,alt:D*altPct,stance:D*stPct,elev:c.elev}};
}
function recommend(D,brg){
  const r=calc(D,brg);
  const act=S.clubs.filter(x=>x.on);
  const maxTot=act.reduce((m,x)=>Math.max(m,x.carry+x.roll),0);
  let mode=S.cond.mode;if(mode==='auto')mode=(maxTot&&D>=0.85*maxTot)?'total':'approach';
  if(R.lay&&S.cond.mode==='auto')mode='total';
  r.mode=mode;const w=MODES[mode].w;
  const cl=act.map(x=>Object.assign({},x,{reach:x.carry+w*x.roll*r.rollMult})).sort((a,b)=>a.reach-b.reach);
  r.list=cl;if(!cl.length)return r;
  let best=null;
  if(mode==='carry'){best=cl.find(x=>x.reach>=r.plays*1.03)||null;}
  else{let bs=1e9;cl.forEach(x=>{const d=x.reach-r.plays,s=d>=0?d:-d*1.5;if(s<bs){bs=s;best=x;}});if(best&&best.reach<r.plays*0.9)best=null;}
  if(best){const i=cl.indexOf(best);r.best=best;r.shorter=cl[i-1]||null;r.longer=cl[i+1]||null;r.swing=(r.plays-w*best.roll*r.rollMult)/best.carry;
    if(i===0&&r.swing<0.92){r.partial=true;if(r.swing<0.35||r.plays<15)r.short=true;}}
  else{r.longest=cl[cl.length-1];r.leave=r.plays-r.longest.reach;}
  return r;
}

function hzPts(h){
  const c={lat:(h.a.lat+h.b.lat)/2,lng:(h.a.lng+h.b.lng)/2},Lh=Math.max(2,dist(h.a,h.b)/2),th=bearing(h.a,h.b)*rad;
  const uE=Math.sin(th),uN=Math.cos(th),vE=Math.cos(th),vN=-Math.sin(th),kx=111320*Math.cos(c.lat*rad);

  const pts=[];

}
function hzInfo(){
  if(!R.me)return [];

    const pts=hzPts(h);let nP=pts[0],fP=pts[0],Dn=1e9,Df=0;
    pts.forEach(p=>{const d=dist(R.me,p);if(d<Dn){Dn=d;nP=p;}if(d>Df){Df=d;fP=p;}});
    const rn=calc(Dn,bearing(R.me,nP)),rf=calc(Df,bearing(R.me,fP));
    const o={h:h,Dn:Dn,Df:Df,nP:nP,fP:fP,pn:Dn*(1+rn.pct),pf:Df*(1+rf.pct)};
    o.clear=act.filter(c=>c.carry>=o.pf+5).sort((a,b)=>a.carry-b.carry)[0]||null;
    o.short=act.filter(c=>c.carry+c.roll*rn.rollMult<=o.pn-8).sort((a,b)=>b.carry-a.carry)[0]||null;
    return o;
  });
}

/* ================= GPS ================= */
let watchId=null;
function setGps(state,text){R.g=[state,text];$('#gps').innerHTML='<i class="dot '+state+'"></i><span>'+tr(text)+'</span>';}
function startGPS(restart){
  if(!navigator.geolocation){setGps('bad','No GPS');return;}
  if(watchId!=null){if(!restart)return;navigator.geolocation.clearWatch(watchId);}
  setGps('wait','Finding GPS…');
  watchId=navigator.geolocation.watchPosition(p=>{
    if(R.manual)return;
    setMe({lat:p.coords.latitude,lng:p.coords.longitude},p.coords.accuracy);
    setGps('ok','GPS ±'+Math.round(p.coords.accuracy*U())+ul());
    maybeWeather(false);
  },err=>{setGps('bad','GPS blocked');refresh();},{enableHighAccuracy:true,maximumAge:1000,timeout:25000});
}
$('#gps').addEventListener('click',()=>{R.mePick=true;setGps('wait','Tap map: where you stand');});

/* ================= weather ================= */
async function maybeWeather(force){
  if(!S.wxAuto&&S.wxOk)return;
  if(!force&&Date.now()-S.wxTime<30*60*1000)return;
  await fetchWeather();
}
async function fetchWeather(){
  const pos=R.me||map.getCenter();
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+pos.lat.toFixed(4)+'&longitude='+pos.lng.toFixed(4)+'&current=temperature_2m,wind_speed_10m,wind_direction_10m,precipitation&wind_speed_unit=kmh');
    const j=(await r.json()).current;
    S.cond.temp=Math.round(j.temperature_2m);S.cond.windKmh=Math.round(j.wind_speed_10m);S.cond.windFrom=Math.round(j.wind_direction_10m);
    S.cond.rain=j.precipitation>=1?2:(j.precipitation>0?1:0);
    S.wxAuto=true;S.wxOk=true;S.wxTime=Date.now();save();refresh();if(!$('#modal').hidden)openCond();
    return true;
  }catch(e){return false;}
}

/* ================= sheet ================= */
const sheetBody=$('#sheetBody');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function refresh(){refreshLines();drawZone();updatePill();renderSheet();scheduleElev();}
let elevKey='',elevTimer=null;
function scheduleElev(){if(elevTimer)clearTimeout(elevTimer);elevTimer=setTimeout(doElev,700);}
async function doElev(){
  if(!R.me)return;
  const aim=R.lay||R.target||R.pin,q=p=>p.lat.toFixed(4)+','+p.lng.toFixed(4);
  const key=q(R.me)+'|'+(aim?q(aim):'');
  if(key===elevKey)return;elevKey=key;
  const pts=aim?[R.me,aim]:[R.me];
  try{
    const r=await fetch('https://api.open-meteo.com/v1/elevation?latitude='+pts.map(p=>p.lat.toFixed(4)).join(',')+'&longitude='+pts.map(p=>p.lng.toFixed(4)).join(','));
    const e=(await r.json()).elevation;
    if(!e||e.length<pts.length||e.some(x=>typeof x!=='number'))return;
    S.alt=Math.max(0,Math.round(e[0]));
    if(pts.length===2&&R.elevSrc!=='manual'){const d=e[1]-e[0];S.cond.elev=Math.abs(d)<2?0:Math.round(d*2)/2;R.elevSrc='auto';}
    save();refresh();
  }catch(err){elevKey='';}
}
function renderSheet(){
  sheetBody.innerHTML=sheetHTML();
  requestAnimationFrame(()=>document.documentElement.style.setProperty('--sh',$('#sheet').offsetHeight+'px'));
}
function wxChips(r){
  const c=S.cond;let wtxt;
  if(c.windKmh<1)wtxt=tr('No wind');
  else if(r){const hd=Math.abs(r.head)>=Math.abs(r.cross);wtxt=wDisp(c.windKmh)+' '+wl()+' '+tr(hd?(r.head>=0?'in your face':'behind you'):(r.cross>0?'from right':'from left'));}
  else wtxt=wDisp(c.windKmh)+' '+wl()+' '+tr('from')+' '+dirL(nearestDir(c.windFrom));
  return '<div class="chiprow"><button class="cond" data-act="cond">💨 '+wtxt+'</button><button class="cond" data-act="cond">🌡 '+c.temp+'°C</button><button class="cond" data-act="cond">'+tr(['☀️ Dry','🌦 Light rain','🌧 Heavy rain'][c.rain])+'</button></div>';
}
function sd(a){if(a.length<2)return 0;const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1));}
function spread(club){
  const prior={lat:Math.max(2,club.carry*0.08),dep:Math.max(2,club.carry*0.07)};
  const m=S.miss[club.id];
  if(m&&m.length>=5){
    const rms=a=>Math.sqrt(a.reduce((s,x)=>s+x*x,0)/a.length),n=m.length,k=3;
    const lat=1.28*rms(m.map(x=>x.lat)),dep=1.28*rms(m.map(x=>x.de));
    return{lat:Math.max(2,(n*lat+k*prior.lat)/(n+k)),dep:Math.max(2,(n*dep+k*prior.dep)/(n+k)),learned:true,n:n};
  }
  return{lat:prior.lat,dep:prior.dep,learned:false,n:0};
}
function swingOf(r,club){const w=(MODES[r.mode]||{}).w||0;return (r.plays-w*club.roll*r.rollMult)/club.carry;}
function expDist(r,club){const sw=swingOf(r,club);const reach=(sw>0&&sw<1)?r.plays:club.reach;return Math.max(0,(reach-S.cond.elev)/(1+r.pct));}
function swingWord(p){return tr(p>=85?'smooth swing':(p>=70?'three-quarter swing':(p>=50?'half swing':'short, soft swing')));}
function lateral(r,club){const dC=expDist(r,club),c=S.cond;const wind=-r.cross*dC*0.004,slope=(c.tilt||0)*0.25*club.roll*r.rollMult;const st=((c.stance===-1?1:c.stance===1?-1:0)+(c.ballh===-1?1:c.ballh===1?-1:0))*0.03*dC*(S.lefty?-1:1);return{wind:wind,slope:slope,stance:st,total:wind+slope+st};}
function activeCtx(){
  const aim=R.lay||R.target||R.pin;if(!R.me||!aim)return null;
  const D=dist(R.me,aim),brg=bearing(R.me,aim),r=recommend(D,brg);
  let club=r.best||r.longest||null;
  if(R.sel&&r.list){const c=r.list.find(x=>x.id===R.sel);if(c)club=c;}
  return{aim,D,brg,r,club};
}
function drawZone(){
  if(ln.zone){map.removeLayer(ln.zone);ln.zone=null;}
  const cx=activeCtx();if(!cx||!cx.club)return;
  const {r,club,brg}=cx,sp=spread(club),dC=expDist(r,club);
  const across0=lateral(r,club).total;
  const sb=Math.sin(brg*rad),cb=Math.cos(brg*rad),pts=[];
  for(let i=0;i<36;i++){
    const t=i/36*2*Math.PI,along=dC+sp.dep*Math.cos(t),across=across0+sp.lat*Math.sin(t);
    const E=along*sb+across*cb,N=along*cb-across*sb;
    pts.push([R.me.lat+N/111320,R.me.lng+E/(111320*Math.cos(R.me.lat*rad))]);
  }
  ln.zone=L.polygon(pts,{color:'#fff',weight:2,fillColor:'#16a34a',fillOpacity:.38,interactive:false}).addTo(map);
}
function sheetHTML(){
  if(S.pending){
    const cl=S.clubs.find(x=>x.id===S.pending.club);
    return '<div class="center"><div class="lbl">'+tr('Shot in progress')+'</div><div class="big-msg">'+esc(cl?tc(cl.name):tr('Club'))+'</div><div class="sub">'+tr('Play your shot, walk to the ball, then tap below to log the real distance.')+'</div></div>'+
    (R.note?'<div class="aim" style="margin-top:10px">'+esc(R.note)+'</div>':'')+'<button class="cta" style="margin-top:14px" data-act="mark">'+tr("📍 I'm at my ball")+'</button><div class="center"><button class="link" data-act="cancelHit">'+tr('Cancel')+'</button></div>';
  }

    return '<div class="center"><div class="big-msg">'+tr('Finding your position…')+'</div><div class="sub">'+tr('Allow location access when asked. No signal?')+'</div></div>'+
    '<button class="cta" style="margin-top:12px;background:var(--ink)" data-act="mepick">'+tr('Set my position on the map')+'</button>';
  }

  if(!cx){
    let h='<div class="center"><div class="big-msg">'+tr('Tap where you want to hit')+'</div><div class="sub">'+tr('Tap where you want to hit, or set the ⛳ pin. Use ⚠ Hazard for water or bunkers.')+'</div></div>'+hzCardHTML()+wxChips(null)+'<div class="center">'+pinLinkHTML()+hzLinkHTML()+'</div>';

  const mine=!!(R.sel&&club&&r.best&&club.id!==r.best.id);
  let h='<div class="hero"><div>';
  if(club){
    h+='<div class="lbl"'+(!r.best&&!mine?' style="color:var(--bad)"':'')+'>'+tr(mine?'Your pick':(R.lay?'Lay-up':(r.partial?'Shorter than any club':(r.best?MODES[r.mode].n:'Out of range'))))+'</div><button class="clubbtn" data-act="picker">'+esc(tc(club.name))+'<span> ▾</span></button>';
  }else h+='<div class="club">'+tr('No clubs')+'</div>';
  h+='</div><div><div class="dist">'+d1(D)+'<small>'+unit+'</small></div><div class="plays">'+tr('plays like {0} {1}',d1(r.plays),unit)+'</div></div></div>';
  if(club&&r.best){const sw=swingOf(r,club);if(sw>0.2&&sw<0.95){const pc=Math.round(sw*100);h+='<div class="aim">'+tr('Swing about <b>{0}%</b> of a full shot ({1})',pc,swingWord(pc))+'</div>';}}
  const lt=club?lateral(r,club):null;
  if(lt&&Math.abs(lt.total)>=2){const why=[];if(Math.abs(lt.wind)>=1)why.push(tr('crosswind'));if(Math.abs(lt.slope)>=1)why.push(tr('slope'));if(Math.abs(lt.stance)>=1)why.push(tr('stance'));const wt=why.length>1?why.slice(0,-1).join(', ')+' '+tr('and')+' '+why[why.length-1]:why[0];h+='<div class="aim">'+tr('↔ Aim {0} {1} {2} for the {3}',d1(Math.abs(lt.total)),unit,tr(lt.total<0?'right|aim':'left|aim'),wt)+'</div>';}
  const p=r.parts,bits=[],sg=v=>(v>0?'+':'')+d1(v);
  if(Math.abs(p.wind)>=1)bits.push(tr(r.head>=0?'Headwind ':'Tailwind ')+sg(p.wind));
  if(Math.abs(p.temp)>=1)bits.push(tr(p.temp>0?'Cold ':'Warm ')+sg(p.temp));
  if(p.rain>=1)bits.push(tr('Rain ')+sg(p.rain));
  if(p.lie>=1)bits.push(tr(LIES[S.cond.lie].n)+' '+sg(p.lie));
  if(Math.abs(p.elev)>=1)bits.push(tr(p.elev>0?'Uphill ':'Downhill ')+sg(p.elev));
  if(Math.abs(p.alt)>=1)bits.push(tr('Altitude ')+sg(p.alt));
  if(Math.abs(p.stance)>=1)bits.push(tr(S.cond.stance===1?'Uphill lie ':'Downhill lie ')+sg(p.stance));
  if(lt&&Math.abs(lt.slope)>=1)bits.push(tr('Side slope ')+tr(lt.slope<0?'left |s':'right |s')+d1(Math.abs(lt.slope)));
  h+='<div class="why">'+(bits.length?bits.join(' · ')+' '+unit:tr('No adjustments. Conditions are neutral.'))+'</div>';
  if(club){
    const dC=expDist(r,club),diff=dC-D;
    h+='<div class="why">'+(Math.abs(diff)<3?tr('Lands right on target.'):tr(diff<0?'Lands about <b>{0} {1} short</b> of the target.':'Lands about <b>{0} {1} past</b> the target.',d1(Math.abs(diff)),unit))+'</div>';
    if(!r.best&&!mine)h+='<div class="why" style="color:var(--bad);font-weight:700">'+tr('Beyond your bag. Lay up and leave ~{0} {1}.',d1(Math.max(0,r.leave)),unit)+'</div>'+(R.lay?'':'<button class="sec" style="width:100%;margin:8px 0" data-act="lay">'+tr('Lay up: choose my line')+'</button>');
  }
  h+=hzCardHTML();
  if(R.lay&&(R.target||R.pin))h+='<div class="why">'+tr('Leaves <b>{0} {1}</b> {2}. Tap the map or drag the amber circle to choose your line.',d1(dist(R.lay,R.target||R.pin)),unit,tr(R.pin?'to the pin':'to the target'))+'</div>';
  h+=wxChips(r);
  if(club)h+='<button class="cta" data-act="hit" data-club="'+club.id+'" data-d="'+Math.round(D)+'" data-e="'+Math.round(expDist(r,club))+'" data-a="'+lateral(r,club).total.toFixed(1)+'">'+tr('Hit {0}',esc(tc(club.name)))+'</button>';
  h+='<div class="center">'+(R.lay?'<button class="link" data-act="unlay">'+tr('✕ Back to target')+'</button>':'<button class="link" data-act="lay">'+tr('Lay up')+'</button>')+pinLinkHTML()+hzLinkHTML()+'<button class="link" data-act="more">'+tr(R.expanded?'Hide details ▴':'Details ▾')+'</button></div>';
  if(R.expanded)h+=detailsHTML(r);
  return h;
}

  const rows=r.list.slice().sort((a,b)=>b.reach-a.reach).map(c=>{
    const diff=c.reach-r.plays,sw=swingOf(r,c);
    return '<button class="pick'+(club&&c.id===club.id?' on':'')+'" data-act="selclub" data-id="'+c.id+'"><span><b>'+esc(tc(c.name))+'</b>'+(r.best&&c.id===r.best.id?' <em>'+tr('recommended')+'</em>':'')+'</span><span>'+d1(c.reach)+' '+unit+' <small>('+(diff>=0?'+':'')+d1(diff)+' · '+(sw>0.2&&sw<0.95?tr('{0}% swing',Math.round(sw*100)):tr('full swing'))+')</small></span></button>';
  }).join('');
  $('#mcard').innerHTML='<div class="row" style="justify-content:space-between"><h3>'+tr('Pick a club')+'</h3><button class="x" data-act="mclose">✕</button></div><div class="sub" style="margin:6px 0 10px">'+tr('Reach vs plays-like distance ({0} {1}). The map shows where each one could land.',d1(r.plays),unit)+'</div>'+rows;

}

function dialSVG(){
  const c=S.cond,F=c.windFrom;
  const pt=(a,rr)=>[100+rr*Math.sin(a*rad),100-rr*Math.cos(a*rad)];
  const [x1,y1]=pt(F,82),[x2,y2]=pt(F,34);
  const ah=(a,rr,s)=>{const [px,py]=pt(a,rr);const l=pt(a-150,s),r=pt(a+150,s);return px+','+py+' '+(px+(l[0]-100))+','+(py+(l[1]-100))+' '+(px+(r[0]-100))+','+(py+(r[1]-100));};
  const ah2=(a,rr,s)=>{const [px,py]=pt(a,rr),l=pt(a+30,s),r=pt(a-30,s);return px+','+py+' '+(px+l[0]-100)+','+(py+l[1]-100)+' '+(px+r[0]-100)+','+(py+r[1]-100);};
  let s='<svg class="dial" id="dial" width="200" height="200" viewBox="0 0 200 200"><circle cx="100" cy="100" r="86" fill="#f2f6f3" stroke="#d3dbd6" stroke-width="2"/>';
  [['N',0],['E',90],['S',180],['W',270]].forEach(d=>{const [tx,ty]=pt(d[1],72);s+='<text x="'+tx+'" y="'+(ty+4)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#5b6b61">'+dirL(d[0])+'</text>';});
  const aim=R.target||R.pin;
  if(R.me&&aim){const b=bearing(R.me,aim),[bx,by]=pt(b,86);s+='<line x1="100" y1="100" x2="'+bx+'" y2="'+by+'" stroke="#16a34a" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 9"/><circle cx="'+bx+'" cy="'+by+'" r="6" fill="#16a34a"/>';}
  if(c.windKmh>=1){s+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/><polygon points="'+ah2(F,34,14)+'" fill="#2563eb"/>';}
  return s+'<circle cx="100" cy="100" r="5" fill="#0f1f16"/></svg>';
}

function dialClick(e){
  const svg=e.currentTarget,rc=svg.getBoundingClientRect();
  const cx=rc.left+rc.width/2,cy=rc.top+rc.height/2;
  let a=Math.atan2(e.clientX-cx,-(e.clientY-cy))/rad;a=(a+360)%360;
  S.cond.windFrom=Math.round(a/5)*5%360;S.wxAuto=false;save();openCond();refresh();
}

/* ---------- rounds & scorecard ---------- */
const fmtTo=v=>v===0?tr('E|par'):(v>0?'+'+v:''+v);
function roundTotals(rd){let sc=0,par=0,pt=0,n=0;rd.holes.forEach(h=>{if(h.score!=null){sc+=h.score;par+=h.par;n++;}if(h.putts!=null)pt+=h.putts;});return{sc,par,n,pt,to:sc-par};}
function isGIR(h){return h.score!=null&&h.putts!=null&&h.score-h.putts<=h.par-2;}
function scoreCls(h){if(h.score==null)return '';const d=h.score-h.par;return d<=-2?'eag':d===-1?'bir':d===0?'':d===1?'bog':'dbl';}
function cardHTML(rd,editable){
  const full=S.stats,cls='sc'+(full?'':' lite');
  let h='<div class="'+cls+' hd"><div>#</div><div>'+tr('Par')+'</div><div>'+tr('Score')+'</div>'+(full?'<div>Putts</div><div>FW</div><div>GIR</div>':'')+'</div>';
  const cells=x=>'<div>'+x.par+'</div><div><span class="scv '+scoreCls(x)+'">'+(x.score==null?'–':x.score)+'</span></div>'+(full?'<div>'+(x.putts==null?'–':x.putts)+'</div><div>'+(x.par<4?'':({hit:'✓',left:'←',right:'→'}[x.fw]||'–'))+'</div><div>'+(x.score==null||x.putts==null?'–':isGIR(x)?'✓':'✗')+'</div>':'');
  const sub=(label,arr)=>{let p=0,s=0,pt=0,any=false;arr.forEach(x=>{p+=x.par;if(x.score!=null){s+=x.score;any=true;}if(x.putts!=null)pt+=x.putts;});return '<div class="'+cls+' tot"><div>'+tr(label)+'</div><div>'+p+'</div><div>'+(any?s:'–')+'</div>'+(full?'<div>'+(pt||'–')+'</div><div></div><div></div>':'')+'</div>';};
  const rows=editable?rd.holes.filter((x,i)=>x.score!=null||i===rd.cur):rd.holes;
  rows.forEach(x=>{const i=x.n-1;
    h+='<div class="'+cls+(editable&&rd.cur===i?' cur':'')+'"'+(editable?' data-act="hole" data-i="'+i+'"':'')+'><div>'+x.n+'</div>'+cells(x)+'</div>';
    if(!editable&&rd.holes.length===18){if(x.n===9)h+=sub('Out',rd.holes.slice(0,9));if(x.n===18)h+=sub('In',rd.holes.slice(9));}
  });
  const left=rd.holes.length-rows.length;
  if(editable&&left>0)h+='<div class="sub center" style="padding:10px">'+tr('{0} more holes to play',left)+'</div>';
  return h+sub('Total',rd.holes);
}
function statsHTML(){
  const rs=S.rounds.filter(rd=>roundTotals(rd).n>=9);if(!rs.length)return '';
  let norm=[],fwH=0,fwN=0,g=0,gN=0,pt=0,ptN=0;
  rs.forEach(rd=>{const t=roundTotals(rd);norm.push(t.sc/t.n*18);rd.holes.forEach(x=>{if(x.par>3&&x.score!=null){fwN++;if(x.fw==='hit')fwH++;}if(x.score!=null&&x.putts!=null){gN++;if(isGIR(x))g++;}if(x.putts!=null){pt+=x.putts;ptN++;}});});
  const avg=Math.round(norm.reduce((a,b)=>a+b,0)/norm.length),best=Math.round(Math.min.apply(null,norm));
  const cell=(l,v)=>'<div class="stat"><div class="lbl">'+tr(l)+'</div><div class="big">'+v+'</div></div>';
  return '<h4 class="lbl" style="margin:18px 0 8px">'+tr('Your stats')+'</h4><div class="stats">'+cell('Rounds',rs.length)+cell('Avg per 18',avg)+cell('Best per 18',best)+(S.stats?cell('Fairways',fwN?Math.round(fwH/fwN*100)+'%':'–')+cell('Greens',gN?Math.round(g/gN*100)+'%':'–')+cell('Putts/hole',ptN?(pt/ptN).toFixed(1):'–'):'')+'</div>';
}
function historyHTML(){
  if(!S.rounds.length)return '';
  return '<h4 class="lbl" style="margin:18px 0 8px">'+tr('Past rounds')+'</h4>'+S.rounds.map(rd=>{const t=roundTotals(rd),d=new Date(rd.date);
    return '<button class="pick" data-act="viewRound" data-id="'+rd.id+'"><span><b>'+esc(rd.course)+'</b><br><small>'+d.toLocaleDateString(S.lang==='pt'?'pt-PT':undefined,{day:'numeric',month:'short',year:'numeric'})+' · '+tr('{0} holes',rd.holes.length)+'</small></span><span><b style="font-size:20px">'+(t.n?t.sc:'–')+'</b> <small>'+(t.n?fmtTo(t.to):'')+'</small></span></button>';}).join('');
}

function openHole(i){

  '<div class="field"><div class="lbl" style="margin-bottom:6px">'+tr('Par')+'</div><div class="seg">'+[3,4,5].map(p=>'<button class="'+(h.par===p?'on':'')+'" data-act="hpar" data-v="'+p+'">'+p+'</button>').join('')+'</div></div>'+stpScore(h);
  if(S.stats){
    html+=stp('Putts','putts',h.putts==null?'–':h.putts);
    if(h.par>3)html+='<div class="field"><div class="lbl" style="margin-bottom:6px">'+tr('Fairway from the tee')+'</div><div class="seg">'+[['hit','✓ Hit'],['left','← Left'],['right','Right →']].map(f=>'<button class="'+(h.fw===f[0]?'on':'')+'" data-act="hfw" data-v="'+f[0]+'">'+tr(f[1])+'</button>').join('')+'</div></div>';
    if(h.score!=null&&h.putts!=null)html+='<div class="sub center" style="margin-bottom:8px">'+tr('Green in regulation: <b>{0}</b>',tr(isGIR(h)?'yes':'no'))+'</div>';
  }
  html+='<button class="cta" data-act="hnav" data-v="1" data-save="1">'+tr(last?'Done':'Next hole ›')+'</button><div class="center"><button class="link" data-act="mclose">'+tr('Close')+'</button></div>';
  $('#mcard').innerHTML=html;$('#modal').hidden=false;

function viewRound(id){

  const mine=S.rlog.filter(s=>s.club===sel.id),n=mine.length,avg=n?mine.reduce((a,s)=>a+s.d,0)/n:null;

  if(R.rmode==='hole')return tog+vhHTML(act,sel);

  '<div class="seg" style="justify-content:center;margin-bottom:14px">'+[['l','← Left'],['c','Straight'],['r','Right →']].map(m=>'<button class="'+((R.rmiss||'c')===m[0]?'on':'')+'" data-act="rmiss" data-v="'+m[0]+'">'+tr(m[1])+'</button>').join('')+'</div>'+
  '<button class="cta" data-act="rlog">'+tr('Log shot with {0}',esc(tc(sel.name)))+'</button>';
  if(n){
    const ds=mine.map(s=>s.d);

/* ---------- virtual hole on the range ---------- */
function vhPar(m){return m<=230?3:(m<=430?4:5);}
function vhRem(v){return Math.hypot(v.x,v.len-v.y);}
function vhHTML(act,sel){
  const v=R.vh,u=ul();
  if(!v){
    return '<div class="hint" style="margin-top:0">'+tr('Enter hole lengths {0}, separated by commas. Hit real shots, enter the carry, and the app moves your ball down the hole.',tr(S.units==='y'?'in yards':'in metres'))+'</div><div class="field"><input type="text" id="vhl" value="'+esc(R.vhText||'380, 165, 510')+'"></div><button class="cta" data-act="vhstart">'+tr('Start')+'</button>';
  }
  if(v.fin){
    const tot=v.done.reduce((a,h)=>a+h.strokes,0),par=v.done.reduce((a,h)=>a+h.par,0);
    return '<div class="big-msg center">'+tr('Round complete')+'</div>'+v.done.map((h,i)=>'<div class="shot"><b>'+tr('Hole {0}',i+1)+'</b><span>'+d1(h.len)+' '+u+' · par '+h.par+' · <b>'+h.strokes+'</b> ('+fmtTo(h.strokes-h.par)+')</span></div>').join('')+'<div class="shot"><b>'+tr('Total')+'</b><span><b>'+tot+'</b> ('+fmtTo(tot-par)+')</span></div><button class="cta" style="margin-top:14px" data-act="vhquit">'+tr('Done')+'</button>';
  }
  const len=v.len,par=vhPar(len);
  let h='<div class="lbl">'+tr('Hole {0} of {1} · par {2}',v.i+1,v.holes.length,par)+' · '+d1(len)+' '+u+'</div>';
  if(v.res){
    const d=v.strokes-par;
    h+='<div class="big-msg">'+tr('{0} strokes ({1})',v.strokes,fmtTo(d))+'</div><div class="why">'+(v.res.pick?tr('Pick up. Too many strokes.'):tr('On the green, {0} {1} from the pin. Putts: {2}.',d1(v.res.rem),u,v.res.putts))+'</div><button class="cta" style="margin-top:14px" data-act="vhnext">'+tr(v.i>=v.holes.length-1?'Done':'Next hole ›')+'</button>';
    return h;
  }
  const rem=vhRem(v),rc=recommend(rem,null),rb=rc.best||rc.longest;
  let cl=sel;const sk=v.i+'|'+v.strokes;
  if(R.vhShot!==sk){R.vhShot=sk;if(rb){cl=rb;S.rsel=rb.id;}R.vhKey=null;}
  const ck=sk+'|'+cl.id;
  if(R.vhKey!==ck){R.vhKey=ck;R.rd=Math.max(0,Math.round(Math.min(cl.carry,rc.plays-cl.roll*0.6)));R.rdClub=cl.id;}
  h+='<div class="hero"><div><div class="lbl">'+tr('To the pin')+'</div><div class="dist" style="text-align:left">'+d1(rem)+'<small>'+u+'</small></div></div><div class="plays">'+tr('Stroke {0}',v.strokes+1)+'</div></div>';
  if(Math.abs(v.x)>=2)h+='<div class="why">'+tr(v.x<0?'{0} {1} left of the line':'{0} {1} right of the line',d1(Math.abs(v.x)),u)+'</div>';
  if(v.last)h+='<div class="why">'+tr('Last shot: {0} {1}',d1(v.last),u)+'</div>';
  if(rb)h+='<div class="aim">'+tr('Caddy suggests {0}',esc(tc(rb.name)))+'</div>';
  h+='<div class="chiprow" style="flex-wrap:wrap">'+act.map(c=>'<button class="cond'+(c.id===cl.id?' pickon':'')+'" data-act="rsel" data-id="'+c.id+'">'+esc(tc(c.name))+'</button>').join('')+'</div>'+
  '<div class="field center"><div class="lbl">'+tr('Carry distance')+'</div><div class="stepper" style="justify-content:center"><button data-act="rstep" data-v="-5">−5</button><button data-act="rstep" data-v="-1">−</button><div class="v">'+d1(R.rd)+'<small> '+u+'</small></div><button data-act="rstep" data-v="1">+</button><button data-act="rstep" data-v="5">+5</button></div></div>'+
  '<div class="seg" style="justify-content:center;margin-bottom:14px">'+[['l','← Left'],['c','Straight'],['r','Right →']].map(m=>'<button class="'+((R.rmiss||'c')===m[0]?'on':'')+'" data-act="rmiss" data-v="'+m[0]+'">'+tr(m[1])+'</button>').join('')+'</div>'+
  '<button class="cta" data-act="vhhit">'+tr('Play this shot')+'</button><div class="center"><button class="link" data-act="vhquit">'+tr('End game')+'</button></div>';
  return h;
}

/* ================= events ================= */
let resetArm=false;
function act(a,b){
  const v=b&&b.dataset.v,c=S.cond;let chg=true;
  switch(a){
    case 'cond':openCond();return;
    case 'mclose':$('#modal').hidden=true;refresh();return;
    case 'bag':openPanel('bag');return;
    case 'mepick':R.mePick=true;setGps('wait','Tap map: where you stand');return;
    case 'more':R.expanded=!R.expanded;if(R.expanded)setTimeout(()=>{const d=document.querySelector('#sheet .det');if(d)d.scrollIntoView({block:'nearest',behavior:'smooth'});},120);break;
    case 'mode':c.mode=v;break;
    case 'lie':c.lie=Number(v);break;
    case 'tilt':c.tilt=Number(v);break;
    case 'stance':c.stance=Number(v);break;
    case 'ballh':c.ballh=Number(v);break;
    case 'lang':S.lang=v==='pt'?'pt':'en';save();applyStatic();openPanel('settings');refresh();return;
    case 'hand':S.lefty=v==='1';save();openPanel('settings');refresh();return;
    case 'elev':R.elevSrc='manual';c.elev=Math.round((c.elev+toM(1)*Number(v))*10)/10;break;
    case 'pinmode':R.placePin=true;break;
    case 'clearpin':R.pin=null;rmKey('p');break;
    case 'hz':R.hzStep='a';refresh();return;
    case 'hzskip':R.hzStep=null;R.hzCur=null;refresh();return;
    case 'hzcancel':if(R.hzStep!=='w'&&R.hzCur)delHz(R.hzCur.id);R.hzStep=null;R.hzCur=null;refresh();return;
    case 'hzdel':delHz(Number(b.dataset.id));refresh();return;
    case 'pincancel':R.placePin=false;refresh();return;
    case 'lay':startLay();return;
    case 'unlay':endLay();return;
    case 'cleartarget':if(R.lay)endLay();R.target=null;rmKey('t');R.framed=false;break;
    case 'ws':c.windKmh=Math.max(0,Math.round(wFrom(wDisp(c.windKmh)+Number(v))));S.wxAuto=false;save();openCond();refresh();return;
    case 'tp':c.temp+=Number(v);S.wxAuto=false;save();openCond();refresh();return;
    case 'rain':c.rain=Number(v);S.wxAuto=false;save();openCond();refresh();return;
    case 'ground':c.ground=Number(v);save();openCond();refresh();return;
    case 'wx':S.wxAuto=true;fetchWeather().then(ok=>{if(!ok)alertNote(tr('No connection – enter manually'));});return;
    case 'hit':S.pending={club:b.dataset.club,start:R.me?{lat:R.me.lat,lng:R.me.lng}:null,target:(function(){const g=R.lay||R.target||R.pin;return g?{lat:g.lat,lng:g.lng}:null;})(),planned:Number(b.dataset.d),exp:Number(b.dataset.e),drift:Number(b.dataset.a)||0};break;
    case 'cancelHit':S.pending=null;break;
    case 'mark':{const p=S.pending;if(p&&p.start&&R.me){const d=dist(p.start,R.me);if(R.acc&&R.acc>25){R.note=tr('GPS is too weak to measure ({0} m). Try again in a few seconds.',Math.round(R.acc));refresh();return;}if(d<10){R.note=tr('That is under 10 m from where you hit. Walk to your ball first.');refresh();return;}R.note='';{(S.hist[p.club]=S.hist[p.club]||[]).push(d);S.hist[p.club]=S.hist[p.club].slice(-15);
      if(p.target){const tb=bearing(p.start,p.target),bb=bearing(p.start,R.me);(S.miss[p.club]=S.miss[p.club]||[]).push({lat:d*Math.sin((bb-tb)*rad)-(p.drift||0),de:d-(p.exp||p.planned)});S.miss[p.club]=S.miss[p.club].slice(-20);}
      S.log.push({t:Date.now(),club:p.club,planned:p.planned,actual:d,hole:S.round?S.round.cur+1:null});S.log=S.log.slice(-200);}}S.pending=null;break;}
    case 'units':S.units=v;save();openPanel('settings');refresh();return;
    case 'quick':{const val=toM(Number($('#q7').value)||0);const cl=S.clubs.find(x=>/^7/.test(x.name))||S.clubs[6]||S.clubs[0];if(val>20&&cl){const f=val/cl.carry;S.clubs.forEach(x=>{x.carry*=f;x.roll*=f;});S.setup=true;save();openPanel('bag');}return;}
    case 'addClub':S.clubs.push({id:'c'+(S.nid++),name:tr('New club'),carry:100,roll:5,on:true});S.setup=true;save();openPanel('bag');return;
    case 'delClub':S.clubs=S.clubs.filter(x=>x.id!==b.dataset.id);delete S.hist[b.dataset.id];delete S.miss[b.dataset.id];save();openPanel('bag');return;
    case 'resetBag':S.clubs=defaultClubs();S.hist={};S.miss={};S.setup=false;save();openPanel('bag');return;
    case 'calib':{const cl=S.clubs.find(x=>x.id===b.dataset.id),hs=S.hist[b.dataset.id];if(cl&&hs&&hs.length){const avg=hs.reduce((x,y)=>x+y,0)/hs.length,f=avg/(cl.carry+cl.roll);cl.carry*=f;cl.roll*=f;S.hist[b.dataset.id]=[];}save();openPanel('bag');return;}
    case 'clearLog':S.log=[];S.hist={};S.miss={};save();openPanel('bag');return;
    case 'resetAll':if(!resetArm){resetArm=true;b.textContent=tr('Tap again to confirm');return;}try{localStorage.removeItem(KEY);}catch(e){}location.reload();return;
    case 'rsel':S.rsel=b.dataset.id;R.rd=null;save();openPanel('range');return;
    case 'rstep':R.rd=Math.max(0,(R.rd||0)+toM(Number(v)));openPanel('range');return;
    case 'rmiss':R.rmiss=v;openPanel('range');return;
    case 'rlog':{S.rlog.push({club:S.rsel,d:R.rd,side:R.rmiss||'c',t:Date.now()});S.rlog=S.rlog.slice(-300);R.rmiss='c';R.rdClub=null;save();openPanel('range');return;}
    case 'rapply':{const cl=S.clubs.find(x=>x.id===S.rsel),m=S.rlog.filter(s=>s.club===S.rsel);if(cl&&m.length>=3){cl.carry=m.reduce((a,s)=>a+s.d,0)/m.length;S.setup=true;save();}openPanel('range');return;}
    case 'rclear':S.rlog=[];R.rd=null;save();openPanel('range');return;
    case 'rmode':R.rmode=v;R.rd=null;openPanel('range');return;
    case 'vhstart':{const t=($('#vhl')||{}).value||'';R.vhText=t;const arr=t.split(/[\s,;]+/).map(Number).filter(x=>x>20&&x<900).map(x=>x/U());if(!arr.length)return;R.vh={holes:arr,i:0,len:arr[0],x:0,y:0,strokes:0,done:[],res:null,last:null,fin:false};R.rd=null;openPanel('range');return;}
    case 'vhhit':{const vv=R.vh,cl=S.clubs.find(x=>x.id===S.rsel);if(!vv||!cl)return;
      S.rlog.push({club:S.rsel,d:R.rd,side:R.rmiss||'c',t:Date.now()});S.rlog=S.rlog.slice(-300);
      const tot=R.rd+cl.roll*0.6,lat=({l:-1,c:0,r:1}[R.rmiss||'c'])*R.rd*0.08;
      vv.y+=tot;vv.x+=lat;vv.strokes++;vv.last=tot;
      const rem=vhRem(vv);
      if(rem<=12){const pu=rem<=3?1:2;vv.strokes+=pu;vv.res={rem:rem,putts:pu};}
      else if(vv.strokes>=10)vv.res={pick:true};
      R.rmiss='c';R.rdClub=null;R.rd=null;save();openPanel('range');return;}
    case 'vhnext':{const vv=R.vh;vv.done.push({len:vv.len,par:vhPar(vv.len),strokes:vv.strokes});
      if(vv.i>=vv.holes.length-1)vv.fin=true;else{vv.i++;vv.len=vv.holes[vv.i];vv.x=0;vv.y=0;vv.strokes=0;vv.res=null;vv.last=null;}
      R.rd=null;R.rdClub=null;openPanel('range');return;}
    case 'vhquit':R.vh=null;R.rd=null;R.rdClub=null;openPanel('range');return;
    case 'picker':openPicker();return;
    case 'selclub':R.sel=b.dataset.id;$('#modal').hidden=true;break;
        case 'nh':S.nh=Number(v);R.cname=($('#rname')||{}).value||R.cname;save();openPanel('round');return;
    case 'startRound':{const name=(($('#rname')||{}).value||'').trim()||tr('My round');R.cname='';S.round={id:Date.now(),date:Date.now(),course:name,cur:0,holes:Array.from({length:S.nh},(_,i)=>({n:i+1,par:4,score:null,putts:null,fw:null}))};save();openPanel('round');refresh();return;}
    case 'hole':$('#panel').hidden=true;openHole(b.dataset.i);refresh();return;
    case 'hstep':{const h=S.round.holes[S.round.cur],k=b.dataset.k,d=Number(v),base=k==='score'?h.par:2;h[k]=Math.max(k==='score'?1:0,(h[k]==null?base:h[k])+d);save();openHole();updatePill();return;}
    case 'hpar0':{const h=S.round.holes[S.round.cur];h.score=h.par;save();openHole();updatePill();return;}
    case 'togstats':S.stats=v==='1';save();openPanel('settings');return;
    case 'setup7':{const val=toM(Number(($('#q7s')||{}).value)||0),cl=S.clubs.find(x=>/^7/.test(x.name))||S.clubs[0];if(val>20&&cl){const f=val/cl.carry;S.clubs.forEach(x=>{x.carry*=f;x.roll*=f;});}S.setup=true;save();$('#modal').hidden=true;refresh();return;}
    case 'skipSetup':S.setup=true;save();$('#modal').hidden=true;refresh();return;
    case 'hpar':{const h=S.round.holes[S.round.cur];h.par=Number(v);if(h.par===3)h.fw=null;save();openHole();updatePill();return;}
    case 'hfw':{const h=S.round.holes[S.round.cur];h.fw=h.fw===v?null:v;save();openHole();return;}
    case 'hnav':{const rd=S.round,n=rd.holes.length,nx=rd.cur+Number(v);if(nx>=0&&nx<n&&nx!==rd.cur)newHole();if(b.dataset.save){const ch=rd.holes[rd.cur];if(ch.score==null)ch.score=ch.par;}if(nx>=n){$('#modal').hidden=true;save();refresh();return;}rd.cur=Math.max(0,nx);save();openHole();updatePill();return;}
    case 'finishRound':{if(!R.armFinish){R.armFinish=true;b.textContent=tr('Tap again to finish');return;}R.armFinish=false;const rd=S.round;rd.end=Date.now();if(roundTotals(rd).n>0)S.rounds.unshift(rd);S.rounds=S.rounds.slice(0,100);S.round=null;save();openPanel('round');refresh();return;}
    case 'viewRound':viewRound(b.dataset.id);return;
    case 'delRound':{if(R.armDel!==b.dataset.id){R.armDel=b.dataset.id;b.textContent=tr('Tap again to delete');return;}R.armDel=null;S.rounds=S.rounds.filter(x=>String(x.id)!==String(b.dataset.id));save();$('#modal').hidden=true;if(!$('#panel').hidden)openPanel('round');return;}
    default:chg=false;
  }
  if(chg){save();refresh();}
}
function alertNote(t){const b=document.querySelector('#mcard .hint span');if(b)b.textContent=t;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b);});
document.addEventListener('change',e=>{
  const t=e.target,f=t.dataset.f;if(!f)return;const id=t.dataset.id,cl=id&&S.clubs.find(x=>x.id===id),val=t.value;
  if(f==='cname'&&cl)cl.name=val;
  else if(f==='ccarry'&&cl){cl.carry=Math.max(0,toM(Number(val)||0));S.setup=true;}
  else if(f==='croll'&&cl){cl.roll=Math.max(0,toM(Number(val)||0));S.setup=true;}
  else if(f==='con'&&cl)cl.on=t.checked;
  save();
});

  const tb={round:'Round',range:'Range',bag:'Bag',settings:'Settings'};document.querySelectorAll('#ptabs button').forEach(b=>b.textContent=tr(tb[b.dataset.p]));
  $('#locate').setAttribute('aria-label',tr('Centre on me'));setGps(R.g?R.g[0]:'wait',R.g?R.g[1]:'Finding GPS…');}
applyStatic();renderSheet();startGPS();if(!S.setup)setTimeout(openSetup,400);
try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}

})();
